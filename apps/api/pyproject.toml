[project]
name = "prism-api"
version = "0.1.0"
description = "Prism 多模态 Agent 后端（FastAPI + Pydantic AI Harness）"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "jintao", email = "jintao0693@users.noreply.github.com" },
]
urls = { Homepage = "https://github.com/jintao0693/Prism", Repository = "https://github.com/jintao0693/Prism" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.17",
  "httpx>=0.28.0",
  "redis>=5.2.0",
  "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
agent = [
  "pydantic-ai>=0.0.49",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
  "E501",  # 行宽由 formatter 管
  "B008",  # FastAPI Depends/Query 默认参数是惯用法
  "B904",  # raise from 逐步收紧
  "RUF001",  # 中文全角标点
  "RUF002",
  "RUF003",
]
