# Prism 本地依赖：Postgres(pgvector) + Redis + MinIO
# 后端默认仍可用 SQLite；需要这些服务时再 up。

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
      POSTGRES_DB: prism
    ports:
      - "5432:5432"
    volumes:
      - prism_pg:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: prism
      MINIO_ROOT_PASSWORD: prismprism
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - prism_minio:/data

volumes:
  prism_pg:
  prism_minio:
